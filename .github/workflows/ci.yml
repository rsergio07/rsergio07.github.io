name: Code Quality and Link Checks

on:
  push:
    branches:
      - main
      - feature/automation
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint CSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Stylelint
        run: |
          npm install -g stylelint stylelint-config-standard

      - name: Lint CSS
        run: |
          stylelint "style.css" # Lints your main CSS file

  link_check:
    name: Check Broken Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install link checker
        run: |
          npm install -g broken-link-checker

      - name: Run link checker
        run: |
          blc index.html --recursive --exclude "https://rsergio.com" --filter-level 3